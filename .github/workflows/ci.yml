name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 获取代码
        uses: actions/checkout@v7

      - name: 配置 Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 测试并构建 Vue 前端
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: 配置 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 测试并打包
        run: mvn --batch-mode verify

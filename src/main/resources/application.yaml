spring:
  application:
    name: personal-knowledge-base

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/personal_knowledge_base_rebuild}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

  ai:
    model:
      embedding: openai
      chat: openai
    openai:
      timeout: 180s
      api-key: ${SILICONFLOW_API_KEY:replace-with-your-api-key}
      base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
      embedding:
        model: ${EMBEDDING_MODEL:BAAI/bge-m3}
      chat:
        options:
          model: ${CHAT_MODEL:Qwen/Qwen2.5-7B-Instruct}
          temperature: 0
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: ${EMBEDDING_DIMENSIONS:1024}
        index-type: HNSW
        distance-type: COSINE_DISTANCE

app:
  storage:
    directory: ${DOCUMENT_STORAGE_DIRECTORY:data/documents}
  ingestion:
    poll-interval: 1s
    lease-duration: 15m
    heartbeat-interval: 30s
    embedding-batch-size: 32
    worker:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 20
  chunk:
    max-chars: 500
    overlap-chars: 50
  rag:
    top-k: 5
    max-context-chars: 2000
    similarity-threshold: 0.55
    rerank-model: ${RERANK_MODEL:BAAI/bge-reranker-v2-m3}
